name: ci

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    # ubuntu-latest moved to 26.04, for which setup-python has no Python 3.9
    # build; the 3.9 leg is still a supported version of this package, so the
    # matrix runs on 24.04 where provisioning works.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pytest
      - name: Unit tests (no browser)
        run: python -m pytest -m "not ui"
      - name: Node URL-state tests
        run: |
          node --version
          node tests/node/state.test.cjs
      - name: Static site is up to date
        run: python scripts/build_web.py --check

  build:
    name: package build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel in a clean venv and smoke it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/vram-calc models | head -20
          /tmp/venv/bin/vram-calc calc --model qwen2.5-7b-instruct --quant q4_k_m --ctx 8192 --json \
            | /tmp/venv/bin/python -c "import json,sys; d=json.load(sys.stdin); assert d['weights']['bytes']==4683073632; print('smoke OK', d['ledger_total']['gib'], 'GiB')"

  ui:
    name: headless UI (chromium + firefox)
    runs-on: ubuntu-latest
    env:
      # Both browsers are mandatory: a launch failure must fail the job, never
      # silently skip a whole browser (the previous revision skipped Firefox).
      UI_REQUIRE_BROWSERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-playwright
          python -m playwright install --with-deps chromium firefox
      - name: UI tests
        run: python -m pytest -m ui tests/test_ui.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: validation/screenshots/*.png
          if-no-files-found: warn